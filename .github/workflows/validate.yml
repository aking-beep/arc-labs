name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: pipeline integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      # Every incubator record against tools/record_schema.yaml:
      #   - the five questions are answered
      #   - stage matches the directory the record lives in
      #   - at least one behavioural or economic evidence signal
      #   - a record past review_by with decision 'pending' FAILS HERE
      #   - graduated_to is registered in portfolio/products.yaml
      #   - portfolio/experiments.yaml is in sync with the records
      - name: Validate records
        run: python tools/labs.py validate

      - name: Pipeline board
        if: always()
        run: python tools/labs.py status

  links:
    name: internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Relative links only. External URLs are deliberately not checked — a flaky
      # third-party host should never fail the pipeline's build.
      - name: Check relative links resolve
        run: python tools/check_links.py

  resources:
    name: resource library (${{ matrix.library }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - library: skills
            check: validate
          - library: workflows
            check: test
          - library: architectures
            check: typecheck
    defaults:
      run:
        working-directory: resources/${{ matrix.library }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: resources/${{ matrix.library }}/package-lock.json

      # Each library is its own deployable app with its own lockfile; Labs does not
      # share dependencies between them.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run ${{ matrix.check }}
      - run: npm run build
