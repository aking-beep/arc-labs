# ARC portfolio registry — hand-maintained.
#
# `products:` is every product that was born in ARC Labs, wherever its code now lives.
# `boundary:` is what is deliberately NOT Labs, recorded so the line stays legible.
#
# Companion file `experiments.yaml` is GENERATED from incubator records — do not edit it.
#
# A Labs record with `graduated_to: <repo>` must match a `repo` below, or
# `tools/labs.py validate` fails: a graduation is not complete until the product
# is registered here.
#
# relationship: labs-product | labs-technology | labs-commercial-experiment | not-labs
# status:       shipped | building | exploring | planned
# repo_confirmed: false means the repository location is a working assumption, not a fact.
#                 Confirm it and set true; do not let a guess calcify into a record.

products:
