    notes: Public CLI and GitHub Action.

  - name: ARC Skills
    repo: aking-beep/arc-labs
    path: resources/skills
    relationship: labs-product
    status: shipped
    repo_confirmed: true
    line: ai-developer-tools
    domain: ai
    one_line: An open library of agent skills (SKILL.md packages) for Claude, Cursor and similar runtimes.
    notes: &resource_move >
      Imported into arc-labs with its history on 2026-10-21. Still deployed from its old
      repository until the Vercel project is repointed (see resources/README.md); archive
