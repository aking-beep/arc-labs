boundary:
  - name: ARC Control
    repo: aking-beep/arc-control
    relationship: not-labs
    status: shipped
    repo_confirmed: false
    mandate: >
      ARC Control makes autonomous technology trustworthy enough to operate in the real
      world.
    notes: >
      Operational infrastructure with reliability obligations to real-world systems.
      Nothing in Control is an experiment, and Control work does not enter the Labs
      pipeline. If a question is "can we make this autonomous system trustworthy", it is
      a Control question. See docs/LABS_CHARTER.md#what-labs-is-not.
