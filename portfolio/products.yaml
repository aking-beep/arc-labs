# ARC portfolio registry — hand-maintained.
#
# `products:` is every ARC Labs product, wherever its code now lives.
# `independent:` is products born in Labs that are now standalone ARC product lines.
# `boundary:` is what is deliberately NOT Labs, recorded so the line stays legible.
# `archive:` is repositories that should be archived on GitHub, and why.
#
# Companion file `experiments.yaml` is GENERATED from incubator records — do not edit it.
#
# A Labs record with `graduated_to: <repo>` must match a `repo` under products: or
# independent:, or
# `tools/labs.py validate` fails: a graduation is not complete until the product
# is registered here.
#
# relationship: labs-product | labs-technology | labs-commercial-experiment | labs-experiment |
#               independent-product | independent-technology | not-labs
# status:       shipped | building | exploring | planned
# line:         ai-developer-tools | travel-experiences | gaming-human-performance | experimental-learning
# path:         where inside `repo` the code lives, when it is not the repository root.
# target:       the final home under the 2026-10-21 consolidation plan, while a move is in
#               progress. Remove it once the move is complete and the old location archived.
# repo_confirmed: false means the repository location is a working assumption, not a fact.
#                 Confirm it and set true; do not let a guess calcify into a record.
#
# Repositories last checked against GitHub on 2026-10-21.

products:
  # ── AI & developer tools ────────────────────────────────────────────────

  - name: AI Fit
    repo: aking-beep/aifit-engine
    relationship: labs-product
    status: shipped
    repo_confirmed: true
    line: ai-developer-tools
    domain: ai
    one_line: A five-minute quiz that names how you use AI and hands you setup files that fit.
    notes: >
      Public name is "Fit"; the repo keeps the aifit-engine slug to avoid confusion with
      aifitengine.com. A second implementation lives in aking-beep/ark (apps/consumer and
      my-ai/). Which one is canonical is reviewed in
      research/ai-agents/2026-10-ai-fit-canonical-code.md.

  - name: MCP Conformance Scanner
    repo: aking-beep/mcp-conformance-scanner
    relationship: labs-product
    status: shipped
    repo_confirmed: true
    line: ai-developer-tools
    domain: ai
    one_line: Scores an MCP server for protocol conformance, auth and security surface, with fixes.
    notes: >
      Public scanner, CLI and GitHub Action. Its rules overlap arc-control's
      packages/mcp-security; keep one rule set and have the other consume it.

  # ── Experimental learning ───────────────────────────────────────────────

  - name: AWS Quest
    repo: aking-beep/arc-labs
    path: experiments/aws-quest
    relationship: labs-experiment
    status: exploring
    repo_confirmed: true
    line: experimental-learning
    domain: gaming
    labs_record: exp-2026-0005-aws-quest
    one_line: A pixel-RPG map that turns daily AWS lessons into playable waypoints.
    notes: >
      Imported into arc-labs with its history on 2026-10-21 as a timeboxed experiment;
      aking-beep/aws-quest can be archived.

# Independent ARC products. Born in ARC Labs, now standalone product lines: each has its own
# repository, roadmap and release cadence, and is expected to grow into its own business.
# Neither ARC Labs nor ARC Control. A Labs record may graduate into one of these.
independent:
  # ── Travel & experiences ────────────────────────────────────────────────

  - name: ARC Travel
    repo: aking-beep/arc-travel
    relationship: independent-product
    status: building
    repo_confirmed: true
    line: travel-experiences
    domain: travel
    one_line: ARC Stay — turns a boutique hotel's local knowledge into a catalog guests can book.
    notes: >
      The repository is a runnable proof of concept on synthetic data (a fictional hotel in
      Puerto Escondido), so its status is building, not shipped.

  - name: Culture Context
    repo: aking-beep/arc-travel
    path: src/modules/culture-context
    relationship: independent-technology
    status: building
    repo_confirmed: true
    line: travel-experiences
    domain: travel
    one_line: Cultural context as a capability, not a standalone product.
    notes: >
      Merged into arc-travel as a module on 2026-10-22 (ADR-024 there), with its tests
      ported; the parity review is
      research/emerging-technology/2026-10-culture-context-into-arc-travel.md. The original
      aking-beep/culture-context repository is on the archive list.

  # ── Gaming & human performance ──────────────────────────────────────────

  - name: CLIMB UP
    repo: aking-beep/climb-up
    relationship: independent-product
    status: shipped
    repo_confirmed: true
    line: gaming-human-performance
    labs_record: exp-2025-0007-climb-up
    domain: gaming
    one_line: A mountaineering strategy game where a careful retreat can outscore a reckless summit.

  - name: Steady Move
    repo: aking-beep/steady-move
    relationship: independent-product
    status: shipped
    repo_confirmed: true
    line: gaming-human-performance
    domain: human-performance
    one_line: An offline-first movement app — check in, get a plan sized to your day, show up.
    notes: Record needs backfilling in incubator/graduated/.

  - name: MIRRORSU
    repo: aking-beep/v0-voice-note-mood-tracker
    relationship: independent-product
    status: building
    repo_confirmed: true
    line: gaming-human-performance
    domain: human-performance
    one_line: A private, voice-first reflection companion — speak freely, notice patterns over time.
    notes: >
      Previously registered as aking-beep/mirrosu, which does not exist; the code lives in
      v0-voice-note-mood-tracker. Separate product from Steady Move — do not merge them.
      Consider renaming the repository to mirrorsu. Record needs backfilling.

# Explicitly outside ARC Labs. Here so the boundary is written down rather than assumed.
boundary:
  - name: ARC Control
    repo: aking-beep/arc-control
    relationship: not-labs
    status: building
    repo_confirmed: true
    mandate: >
      ARC Control makes autonomous technology trustworthy enough to operate in the real
      world.
    notes: >
      The one canonical Control repository. Operational infrastructure with reliability
      obligations to real-world systems. Nothing in Control is an experiment, and Control
      work does not enter the Labs pipeline. If a question is "can we make this autonomous
      system trustworthy", it is a Control question. See
      docs/LABS_CHARTER.md#what-labs-is-not. Its policy engine is the canonical one
      (arc-control docs/adr/0001-canonical-policy-engine.md, accepted). The division's own
      list of repositories is arc-control docs/PORTFOLIO.md.

  - name: AI Fit Teams
    repo: aking-beep/aifit-engine
    path: apps/teams
    relationship: not-labs
    status: building
    repo_confirmed: true
    notes: >
      An ARC Control product: team-level AI capability mapping for engineering leaders,
      calibrated by Control's GET /api/v1/calibration. Its code lives in aifit-engine (a
      Labs repository) beside AI Fit, with its own deployment. Vercel still deploys it from
      aking-beep/ark until the project is repointed to apps/teams here.

  - name: ARC Skills
    repo: aking-beep/arc-skills
    relationship: not-labs
    status: shipped
    repo_confirmed: true
    notes: An ARC Control product. An open library of agent skills (SKILL.md packages).

  - name: AI Workflow Templates
    repo: aking-beep/ai-workflow-templates
    relationship: not-labs
    status: shipped
    repo_confirmed: true
    notes: An ARC Control product. An open catalog of AI workflows, most stopping at a human gate.

  - name: Reference Architectures
    repo: aking-beep/reference-architectures
    relationship: not-labs
    status: shipped
    repo_confirmed: true
    notes: An ARC Control product. An open library of system blueprints and their trade-offs.

  - name: Prompt Reviewer
    repo: aking-beep/prompt-reviewer
    relationship: not-labs
    status: shipped
    repo_confirmed: true
    notes: An ARC Control product. Static review that says whether a system prompt is ready to ship.

  - name: Connectivity Scanner
    repo: aking-beep/connectivity-scanner
    relationship: not-labs
    status: shipped
    repo_confirmed: true
    notes: An ARC Control product. Grades an endpoint for reachability, TLS, speed and security headers.

  - name: ARK (legacy monorepo)
    repo: aking-beep/ark
    relationship: not-labs
    status: building
    repo_confirmed: true
    notes: >
      Legacy, migrating. apps/control and the Control packages (guard, protocols, runtime)
      consolidate into arc-control under ADR-0001 steps 2–11. AI Fit Teams is already in
      aifit-engine/apps/teams; remove apps/business from ark once Vercel deploys it from
      there. Archive ark when nothing deploys from it.

  - name: ARC Transformation Group website
    repo: aking-beep/arc-website
    relationship: not-labs
    status: shipped
    repo_confirmed: true
    notes: >
      Corporate. Marketing, research, consulting and commerce (the paid Playbooks, Paddle).
      Represents both divisions through product pages; never holds their application code.

# Repositories to archive on GitHub (Settings → Danger Zone → Archive this repository).
# Archive, never delete: old links keep opening.
archive:
  - repo: aking-beep/culture-context
    reason: Merged into arc-travel as src/modules/culture-context. Nothing deploys from it.
  - repo: aking-beep/aws-quest
    reason: Moved into arc-labs/experiments/aws-quest with its history. Nothing deploys from it.
  - repo: aking-beep/arc-agent-governance
    reason: Empty. Agent governance belongs inside arc-control.
  - repo: aking-beep/arc-ai-security-scanner
    reason: Empty. Enterprise scanning goes into arc-control when needed.
  - repo: aking-beep/arc-journey-scanner
    reason: Empty. Recreate as a Labs experiment if it is ever prioritized.
